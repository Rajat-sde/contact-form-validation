<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- SEO Meta Tags -->
        <title>DevForm | Interactive Contact & Validation Engine</title>
        <meta name="description"
            content="A modern, glassmorphic contact form featuring client-side JavaScript validation, accessibility standards, and instant visual feedback.">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <!-- Main Contact Card -->
        <main class="form-card">

            <!-- Header Badge -->
            <header class="form-header">
                <span class="brand">DevForm</span>
                <span class="status-dot" title="Form Ready"></span>
            </header>

            <h1 class="form-title">Get in Touch</h1>
            <p class="form-subtitle">Send us a message and we'll respond ASAP.</p>

            <!-- Success Feedback Banner (Hidden by default) -->
            <div id="successMessage" class="success-banner" aria-live="polite">
                ✔ Message sent successfully! Thank you.
            </div>

            <!-- Contact Form ('novalidate' disables default browser tooltips so JS handles custom UI) -->
            <form id="contactForm" novalidate action="mailto:rajat.cse.up@gmail.com" method="post" enctype="text/plain">

                <!-- Field 1: Name -->
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="e.g. John Doe"
                        autocomplete="name">
                    <span id="nameError" class="error-text"></span>
                </div>

                <!-- Field 2: Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="e.g. john@example.com"
                        autocomplete="email">
                    <span id="emailError" class="error-text"></span>
                </div>

                <!-- Field 3: Message -->
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="4"
                        placeholder="Write your message here..."></textarea>
                    <span id="messageError" class="error-text"></span>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="btn-submit">
                    Send Message
                </button>

            </form>
        </main>

        <script src="script.js"></script>
    </body>
</html>
